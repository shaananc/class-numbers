name: Refresh class data & deploy

on:
  schedule:
    - cron: "17 10-23 * * *" # hourly, 6am–7pm US Eastern
    - cron: "17 1,4,7 * * *" # every 3 hours overnight
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch class data from SIS
        # On pushes, deploy code changes immediately without a slow re-scrape;
        # scheduled runs and manual dispatches do the full refresh.
        if: github.event_name != 'push'
        run: python3 scripts/fetch_data.py

      - name: Commit updated data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Refresh class data"
          git pull --rebase origin main
          git push

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
