<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tufts Class Explorer</title>
<meta name="description" content="Fast, no-login search of Tufts classes with live-ish enrollment numbers.">
<script>
try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
/* Tufts brand palette (brand.tufts.edu/guidelines/color). Tufts Blue #3E8EDE is
   too light for small text on light grounds, so light mode uses Ballou Blue for
   text accents and keeps Tufts Blue for large/decorative use. Flame Orange is
   darkened (#B2500E) in light mode to meet WCAG contrast. */
:root {
  color-scheme: light;
  --bg: #F7F3EE;
  --surface: #FFFFFF;
  --surface2: #F2EDE7;          /* Candle White */
  --text: #3D2E25;              /* Bessie Brown */
  --text-dim: #6B5446;
  --border: #E2D9CF;
  --brand: #3E8EDE;             /* Tufts Blue */
  --accent: #3F5EAB;            /* Ballou Blue */
  --accent-soft: #E4EEFA;
  --open: #1A5532;              /* Prez Lawn Green */
  --closed: #C0311A;            /* Alert Red */
  --wait: #B2500E;
  --bar-bg: #E8E1D9;
  --shadow: 0 1px 3px rgba(61,46,37,.08);
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0C1626;
    --surface: #132238;
    --surface2: #192B45;
    --text: #F2EDE7;
    --text-dim: #B4BFCE;
    --border: #2A3E5C;
    --accent: #6FAAE8;
    --accent-soft: #1D3558;
    --open: #98D5C7;            /* Aurora Green */
    --closed: #F0705C;
    --wait: #FFC72C;            /* Beacon Yellow */
    --bar-bg: #2A3E5C;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0C1626;
  --surface: #132238;
  --surface2: #192B45;
  --text: #F2EDE7;
  --text-dim: #B4BFCE;
  --border: #2A3E5C;
  --accent: #6FAAE8;
  --accent-soft: #1D3558;
  --open: #98D5C7;
  --closed: #F0705C;
  --wait: #FFC72C;
  --bar-bg: #2A3E5C;
  --shadow: 0 1px 3px rgba(0,0,0,.4);
}
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto !important; }
  .livedot { animation: none !important; }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  border-top: 4px solid var(--brand);
}
.wrap { max-width: 880px; margin: 0 auto; padding: 0 16px 80px; }
header { padding: 24px 0 6px; display: flex; align-items: center; gap: 4px 12px; flex-wrap: wrap; }
header h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
header h1 .jumbo { color: var(--brand); }
#updated { font-size: 12.5px; color: var(--text-dim); }
.themes { margin-left: auto; }
.themes button { padding: 5px 8px; display: inline-flex; align-items: center; }
.themes svg { width: 16px; height: 16px; }

.controls {
  position: sticky; top: 0; z-index: 10;
  background: var(--bg);
  padding: 10px 0 12px;
}
.searchrow { display: flex; gap: 8px; }
#q {
  flex: 1;
  font-size: 17px;
  padding: 12px 16px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow);
}
#q::placeholder { color: var(--text-dim); }
#q:focus { border-color: var(--accent); }
#q:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.filters { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
select, .toggle {
  font-size: 13.5px;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
}
.seg {
  display: inline-flex; border: 1px solid var(--border); border-radius: 8px;
  overflow: hidden; background: var(--surface);
}
.seg button {
  font: inherit; font-size: 13.5px; padding: 7px 12px; border: 0;
  background: transparent; color: var(--text); cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.seg button:focus-visible { outline-offset: -2px; }
.seg .new {
  font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  color: var(--accent); margin-left: 6px;
}
.banner {
  display: flex; align-items: center; gap: 12px; margin: 8px 0 0;
  padding: 8px 10px 8px 14px; font-size: 13.5px;
  background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid var(--accent); border-radius: 8px;
}
.banner span { flex: 1; }
.banner .bx {
  background: none; border: 0; color: var(--text-dim); font-size: 18px;
  line-height: 1; cursor: pointer; padding: 0 4px;
}
.toggle { user-select: none; display: inline-flex; align-items: center; gap: 6px; }
.toggle input { accent-color: var(--accent); margin: 0; }
.toggle.on { border-color: var(--accent); background: var(--accent-soft); }
#count { font-size: 13px; color: var(--text-dim); margin-left: auto; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-top: 12px;
  overflow: hidden;
}
.card > summary {
  list-style: none;
  cursor: pointer;
  padding: 14px 16px;
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}
.card > summary::-webkit-details-marker { display: none; }
.card > summary:focus-visible { outline-offset: -2px; border-radius: var(--radius); }
.cnum {
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
  white-space: nowrap;
}
.ctitle { font-weight: 600; flex: 1 1 260px; }
.cmeta { font-size: 12.5px; color: var(--text-dim); white-space: nowrap; }
.secs { border-top: 1px solid var(--border); }
.sec {
  display: grid;
  grid-template-columns: minmax(72px,auto) 1fr minmax(150px, 190px);
  gap: 4px 14px;
  padding: 11px 16px;
  border-top: 1px solid var(--border);
  align-items: center;
}
.sec:first-child { border-top: none; }
.sec .sid { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13.5px; }
.sec .sid .cn { display: block; font-weight: 400; font-size: 11.5px; color: var(--text-dim); }
.sec .mid { font-size: 13.5px; min-width: 0; }
.sec .mid .instr { font-weight: 500; }
.sec .mid .when { color: var(--text-dim); }
.enr { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }
.enr .nums { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.enr .nums b { font-size: 14.5px; }
.bar { height: 5px; background: var(--bar-bg); border-radius: 3px; margin-top: 5px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--open); }
.bar i.full { background: var(--closed); }
.bar i.near { background: var(--wait); }
.wl { font-size: 11.5px; color: var(--text-dim); margin-top: 3px; }
.st { display: block; font-size: 11.5px; font-weight: 600; margin-top: 1px; }
.st::before {
  content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  margin-right: 4px; background: currentColor; vertical-align: 1px;
}
.st.O { color: var(--open); }
.st.C { color: var(--closed); }
.st.W { color: var(--wait); }
.desc {
  padding: 12px 16px;
  font-size: 13.5px;
  color: var(--text-dim);
  border-top: 1px solid var(--border);
  background: var(--surface2);
  white-space: pre-line;
}
.desc .tags { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
.tag {
  font-size: 11.5px; padding: 2px 8px; border-radius: 20px;
  background: var(--accent-soft); color: var(--accent); font-weight: 500;
}
.livedot {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  background: var(--open); margin-right: 4px; animation: pulse 2s infinite;
}
@keyframes pulse { 50% { opacity: .35; } }
.empty { text-align: center; color: var(--text-dim); padding: 60px 0; font-size: 15px; }
#more { display: block; margin: 18px auto 0; padding: 9px 22px; font-size: 14px;
  border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
  color: var(--accent); cursor: pointer; font-weight: 600; }
#more[hidden] { display: none; }
footer { margin-top: 40px; font-size: 12px; color: var(--text-dim); text-align: center; }
footer a { color: var(--accent); }
@media (max-width: 560px) {
  .controls { position: static; }  /* sticky filters would cover half a phone screen */
  .sec { grid-template-columns: 1fr; }
  .enr { text-align: left; max-width: 230px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="jumbo">Tufts</span> Class Explorer</h1>
    <span id="updated">loading…</span>
    <div class="seg themes" role="group" aria-label="Color theme">
      <button type="button" data-theme-set="system" aria-label="Match system theme" title="Match system">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
      </button>
      <button type="button" data-theme-set="light" aria-label="Light theme" title="Light">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button type="button" data-theme-set="dark" aria-label="Dark theme" title="Dark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
      </button>
    </div>
  </header>
  <main>
  <div id="banner" class="banner" role="status" hidden></div>

  <div class="controls" role="search" aria-label="Class search">
    <div class="searchrow">
      <label for="q" class="sr-only">Search classes</label>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search by course number, title, instructor, or keyword — e.g. CS 151, Cohney, security…" autofocus>
    </div>
    <div class="filters">
      <div id="term" class="seg" role="group" aria-label="Semester"></div>
      <select id="career" aria-label="Career"><option value="">All careers</option></select>
      <select id="subject" aria-label="Subject"><option value="">All subjects</option></select>
      <label class="toggle" id="openTog"><input type="checkbox" id="openOnly">Open seats</label>
      <label class="toggle" id="subTog" title="Hide independent study, thesis, internship, and similar placeholder listings"><input type="checkbox" id="hideNonsub" checked>Hide ind. study&hairsp;/&hairsp;thesis</label>
      <span id="count" role="status" aria-live="polite"></span>
    </div>
  </div>

  <div id="results"></div>
  <button id="more" hidden>Show more</button>
  </main>

  <footer>
    Unofficial. Expanded classes show <span class="livedot"></span>live enrollment; other numbers are re-scraped hourly —
    always confirm in <a href="https://sis.it.tufts.edu/psp/paprd/EMPLOYEE/EMPL/h/?tab=TFP_CLASS_SEARCH">SIS</a>.
    <span id="gen"></span>
    <br>Made with &lt;3 by Dr. <a href="https://cohney.info">Shaanan Cohney</a>
  </footer>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const LIVE_API = "https://starkiller.tail283e6.ts.net";
const state = { term: null, data: null, shown: 40, liveOk: null };
const liveCache = new Map(); // class_num -> {enrolled, cap, wait, wait_cap}
const STATUS = { O: "Open", C: "Closed", W: "Waitlist" };

function syncThemeButtons() {
  const cur = document.documentElement.dataset.theme || "system";
  for (const b of document.querySelectorAll("[data-theme-set]"))
    b.setAttribute("aria-pressed", String(b.dataset.themeSet === cur));
}
document.querySelector(".themes").addEventListener("click", e => {
  const b = e.target.closest("[data-theme-set]");
  if (!b) return;
  const t = b.dataset.themeSet;
  if (t === "system") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t;
  try { t === "system" ? localStorage.removeItem("theme") : localStorage.setItem("theme", t); } catch {}
  syncThemeButtons();
});
syncThemeButtons();
const CAREERS = {
  ASEU: "AS&E Undergrad/Grad", GRAD: "Graduate", MEDS: "Medical",
  DENT: "Dental", VETS: "Veterinary", NUTR: "Nutrition", FLET: "Fletcher",
  OTPD: "Occupational Therapy", PA: "Physician Asst", PHPD: "Public Health",
};

const NONSUBST = new RegExp("\\b(" + [
  "independent stud(y|ies)", "independent research", "independent work",
  "directed stud(y|ies)", "directed research", "directed reading",
  "supervised research", "guided stud(y|ies)", "special problems",
  "thesis", "dissertation", "internship", "practicum", "apprenticeship",
  "co-?op(erative)? (education|experience|work)", "continuation",
  "research credit", "teaching assistant", "graduate research",
  "doctoral research", "field ?work experience", "clinical experience",
].join("|") + ")\\b", "i");

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

let termIdx = [];
// term codes (2<yy><2|5|8>) sort chronologically as strings
const sortTerms = idx => [...idx].sort((a, b) => a.term.localeCompare(b.term));
const NEW_TERM_DAYS = 21;

function isNewTerm(t) {
  return !!t.first_seen && Date.now() - Date.parse(t.first_seen) < NEW_TERM_DAYS * 864e5;
}

function renderTermTabs() {
  $("term").innerHTML = [...termIdx].reverse().map(t =>
    `<button type="button" data-term="${esc(t.term)}" aria-pressed="${t.term === (state.want || state.term)}">` +
    `${esc(t.label)}${isNewTerm(t) ? '<span class="sr-only">,</span><span class="new">new</span>' : ""}</button>`).join("");
}

function updateBanner() {
  const t = [...termIdx].reverse().find(isNewTerm);
  let dismissed = false;
  try { dismissed = !!t && localStorage.getItem("dismissed-term-" + t.term) === "1"; } catch {}
  if (!t || dismissed) { $("banner").hidden = true; return; }
  $("banner").innerHTML = `<span><b>${esc(t.label)}</b> classes are now available.</span>` +
    `<button type="button" class="bx" aria-label="Dismiss">×</button>`;
  $("banner").dataset.term = t.term;
  $("banner").hidden = false;
}

$("term").addEventListener("click", e => {
  const b = e.target.closest("button[data-term]");
  if (b && b.dataset.term !== (state.want || state.term)) loadTerm(b.dataset.term);
});
$("banner").addEventListener("click", e => {
  if (e.target.closest(".bx")) {
    try { localStorage.setItem("dismissed-term-" + $("banner").dataset.term, "1"); } catch {}
    $("banner").hidden = true;
  }
});

async function loadIndex() {
  termIdx = sortTerms(await (await fetch("data/index.json", { cache: "no-cache" })).json());
  // default to the most recent semester, unless deep-linked
  const p0 = readHash();
  applyingHash = true; // don't let the initial render clobber the deep link
  const want = p0.get("t");
  await loadTerm(termIdx.some(t => t.term === want) ? want : termIdx[termIdx.length - 1].term);
  applyHash(p0);
}

// --- deep links: keep app state in location.hash ---
let applyingHash = false;
function readHash() { return new URLSearchParams(location.hash.slice(1)); }

function applyHash(p = readHash()) {
  applyingHash = true;
  $("q").value = p.get("q") || "";
  if ([...$("career").options].some(o => o.value === (p.get("c") || ""))) $("career").value = p.get("c") || "";
  if ([...$("subject").options].some(o => o.value === (p.get("s") || ""))) $("subject").value = p.get("s") || "";
  $("openOnly").checked = p.get("o") === "1";
  $("hideNonsub").checked = p.get("all") !== "1";
  state.shown = 40;
  render();
  for (const num of (p.get("x") || "").split(",").filter(Boolean)) {
    for (const card of document.querySelectorAll("details.card"))
      if (card.querySelector(".cnum")?.textContent === num.replace("-", " ")) card.open = true;
  }
  applyingHash = false;
  writeHash();
}

function writeHash() {
  if (applyingHash || !state.data) return;
  const p = new URLSearchParams();
  p.set("t", state.term);
  const q = $("q").value.trim();
  if (q) p.set("q", q);
  if ($("career").value) p.set("c", $("career").value);
  if ($("subject").value) p.set("s", $("subject").value);
  if ($("openOnly").checked) p.set("o", "1");
  if (!$("hideNonsub").checked) p.set("all", "1");
  const open = [...new Set([...document.querySelectorAll("details.card[open] .cnum")]
    .map(e => e.textContent.replace(" ", "-")))].slice(0, 8);
  if (open.length) p.set("x", open.join(","));
  history.replaceState(null, "", "#" + p.toString());
}

window.addEventListener("hashchange", async () => {
  if (applyingHash) return;
  const p = readHash(); // capture before loadTerm's render rewrites the hash
  const t = p.get("t");
  if (t && t !== state.term && termIdx.some(x => x.term === t)) {
    applyingHash = true;
    await loadTerm(t);
  }
  applyHash(p);
});

let loadSeq = 0;
async function loadTerm(term) {
  const seq = ++loadSeq;
  state.want = term;
  renderTermTabs();
  $("updated").textContent = "loading " + term + "…";
  const data = await (await fetch(`data/${term}.json`, { cache: "no-cache" })).json();
  if (seq !== loadSeq) return; // a newer term switch superseded this one
  if (term !== state.term) liveCache.clear(); // class numbers can repeat across terms
  state.term = term; state.want = null; state.data = data; state.shown = 40;
  renderTermTabs();
  updateBanner();
  // normalize a search haystack per course
  for (const c of data.courses) {
    const instr = new Set(), attrs = new Set();
    for (const s of c.sections) {
      s.instructors.forEach(i => instr.add(i));
      if (s.attrs) s.attrs.split(/[|,]/).forEach(a => { a = a.trim(); if (a) attrs.add(a); });
    }
    c._instr = [...instr];
    c._attrs = [...attrs];
    const [subj, catnum = ""] = c.num.split("-");
    const bare = catnum.replace(/^0+/, "") || catnum;
    c._subject = subj;
    // compact course-number aliases so "cs151", "cs 151", "CS-0151" all match
    c._numAlts = [...new Set([subj + catnum, subj + bare])].map(a => a.toLowerCase());
    c._hay = (`${subj} ${catnum} ${subj} ${bare} ${c._numAlts.join(" ")} ` + c.title +
      " " + c._instr.join(" ") + " " + (c.desc || "")).toLowerCase();
    c._sub = !NONSUBST.test(c.title);
  }
  showUpdated();
  buildFilters(data);
  render();
}

function showUpdated() {
  if (!state.data) return;
  const mins = Math.max(0, Math.round((Date.now() - new Date(state.data.generated)) / 60000));
  const ago = mins < 60 ? `${mins} min ago` : `${Math.round(mins / 60)} h ago`;
  $("updated").textContent = `enrollment updated ${ago}`;
}

// keep the page live: pick up fresh data as the refresh workflow publishes it
setInterval(async () => {
  showUpdated();
  try {
    const idx = sortTerms(await (await fetch("data/index.json", { cache: "no-cache" })).json());
    if (idx.map(t => t.term).join() !== termIdx.map(t => t.term).join()) {
      termIdx = idx; // a semester was added/removed while the tab was open
      renderTermTabs();
      updateBanner();
    }
    const cur = idx.find(t => t.term === state.term);
    if (cur && state.data && cur.generated !== state.data.generated) {
      const open = new Set([...document.querySelectorAll("details[open] .cnum")].map(e => e.textContent));
      await loadTerm(state.term);
      for (const el of document.querySelectorAll(".card"))
        if (open.has(el.querySelector(".cnum")?.textContent)) el.open = true;
    }
  } catch {}
}, 5 * 60 * 1000);

function buildFilters(data) {
  const prevSubj = $("subject").value, prevCar = $("career").value;
  const subjects = [...new Set(data.courses.map(c => c._subject))].sort();
  $("subject").innerHTML = '<option value="">All subjects</option>' +
    subjects.map(s => `<option>${esc(s)}</option>`).join("");
  const careers = [...new Set(data.courses.map(c => c.career))].sort();
  $("career").innerHTML = '<option value="">All careers</option>' +
    careers.map(c => `<option value="${esc(c)}">${esc(CAREERS[c] || c)}</option>`).join("");
  // keep the user's selections across term switches and background refreshes
  if (subjects.includes(prevSubj)) $("subject").value = prevSubj;
  if (careers.includes(prevCar)) $("career").value = prevCar;
}

function score(c, terms, qcompact) {
  let s = 0;
  if (qcompact && c._numAlts.some(a => a.startsWith(qcompact))) s += 60;
  for (const t of terms) {
    if (!c._hay.includes(t)) return -1;
    if (c._numAlts.some(a => a.startsWith(t))) s += 30;
    else if (c.title.toLowerCase().includes(t)) s += 12;
    else if (c._instr.some(i => i.toLowerCase().includes(t))) s += 10;
    else s += 1;
  }
  return s;
}

function matches() {
  const q = $("q").value.trim().toLowerCase();
  const subj = $("subject").value, car = $("career").value, open = $("openOnly").checked;
  const hideNonsub = $("hideNonsub").checked;
  const terms = q.split(/\s+/).filter(Boolean);
  const qcompact = /^[a-z]{2,6}[\s-]*0*\d/.test(q) ? q.replace(/[\s-]+/g, "").replace(/^([a-z]+)0+/, "$1") : "";
  const out = [];
  for (const c of state.data.courses) {
    if (subj && c._subject !== subj) continue;
    if (car && c.career !== car) continue;
    if (open && !c.sections.some(s => s.status === "O")) continue;
    if (hideNonsub && !c._sub) continue;
    let sc = 0;
    if (terms.length) {
      sc = score(c, terms, qcompact);
      if (sc < 0) continue;
    }
    out.push([sc, c]);
  }
  out.sort((a, b) => b[0] - a[0] || a[1].num.localeCompare(b[1].num));
  return out.map(x => x[1]);
}

function meetingStr(s) {
  const parts = s.meetings.map(m => `${(m.days || []).join("")} ${m.start}–${m.end}`);
  return [...new Set(parts)].join(" · ");
}

function enrHtml(s) {
  if (s.cap == null && s.enrolled == null) return '<div class="enr"><span class="cmeta">no data</span></div>';
  const en = s.enrolled ?? 0, cap = s.cap ?? 0;
  const pct = cap > 0 ? Math.min(100, Math.round(en / cap * 100)) : (en > 0 ? 100 : 0);
  const cls = pct >= 100 ? "full" : pct >= 85 ? "near" : "";
  const wl = (s.wait_cap > 0 || s.wait > 0) ? `<div class="wl">waitlist ${s.wait ?? 0}/${s.wait_cap ?? 0}</div>` : "";
  return `<div class="enr">
    <div class="nums"><span>${s._live ? '<span class="livedot"></span>live' : "enrolled"}</span><b>${en}${cap ? " / " + cap : ""}</b></div>
    <div class="bar" aria-hidden="true"><i class="${cls}" style="width:${pct}%"></i></div>${wl}
  </div>`;
}

function secHtml(s) {
  if (liveCache.has(s.class_num)) s = { ...s, ...liveCache.get(s.class_num), _live: true };
  const instr = s.instructors.length ? s.instructors.join(", ") : "STAFF";
  const when = meetingStr(s);
  const room = s.rooms.join("; ");
  const bits = [when, room, s.mode && s.mode !== "In Person" ? s.mode : "", s.campus !== "Medford/Somerville" ? s.campus : ""].filter(Boolean);
  return `<div class="sec" data-cn="${esc(s.class_num)}">
    <div class="sid">${esc(s.sec)}<span class="cn">#${esc(s.class_num)}</span>${STATUS[s.status] ? `<span class="st ${esc(s.status)}">${STATUS[s.status]}</span>` : ""}</div>
    <div class="mid"><span class="instr">${esc(instr)}</span><br><span class="when">${esc(bits.join(" · ")) || "time TBA"}</span></div>
    ${enrHtml(s)}
  </div>`;
}

// Labs/recitations/discussions are companion meetings for the same students
// already counted in the primary (lecture-type) section — summing every
// section's "enrolled" double- (or triple-)counts those students. Count only
// primary-type sections; if a course has none (e.g. a standalone lab), fall
// back to whichever companion type has the fewest sections, since that's the
// undivided "parent" group the others were split from.
const COMPANION_COMPONENTS = new Set(["Recitation", "Recitation (Optional)", "Laboratory", "Discussion", "Once Per Week", "Small Group"]);
function courseEnrolled(c) {
  const primary = c.sections.filter(s => !COMPANION_COMPONENTS.has(s.component));
  if (primary.length) return primary.reduce((a, s) => a + (s.enrolled || 0), 0);
  const byType = new Map();
  for (const s of c.sections) {
    const t = byType.get(s.component) || { n: 0, en: 0 };
    t.n++; t.en += s.enrolled || 0;
    byType.set(s.component, t);
  }
  let best = null;
  for (const t of byType.values())
    if (!best || t.n < best.n || (t.n === best.n && t.en > best.en)) best = t;
  return best ? best.en : 0;
}

function courseHtml(c, openNow) {
  const totEn = courseEnrolled(c);
  const nsec = c.sections.length;
  const tags = c._attrs.slice(0, 6).map(a => `<span class="tag">${esc(a)}</span>`).join("");
  const notes = [...new Set(c.sections.map(s => s.note).filter(Boolean))].join("\n\n");
  return `<details class="card"${openNow ? " open" : ""}>
    <summary>
      <span class="cnum">${esc(c.num.replace("-", " "))}</span>
      <span class="ctitle">${esc(c.title)}</span>
      <span class="cmeta">${totEn} enrolled · ${nsec} section${nsec > 1 ? "s" : ""}</span>
    </summary>
    <div class="secs">${c.sections.map(secHtml).join("")}</div>
    ${(c.desc || notes || tags) ? `<div class="desc">${esc(c.desc || "")}${notes ? "\n\n" + esc(notes) : ""}${tags ? `<div class="tags">${tags}</div>` : ""}</div>` : ""}
  </details>`;
}

function render() {
  const list = matches();
  const q = $("q").value.trim();
  $("count").textContent = `${list.length} course${list.length === 1 ? "" : "s"}`;
  $("openTog").classList.toggle("on", $("openOnly").checked);
  $("subTog").classList.toggle("on", $("hideNonsub").checked);
  const slice = list.slice(0, state.shown);
  $("results").innerHTML = slice.length
    ? slice.map(c => courseHtml(c, !!q && list.length <= 5)).join("")
    : `<div class="empty">No classes match${q ? ` “${esc(q)}”` : ""}. Try fewer words or clear the filters.</div>`;
  $("more").hidden = list.length <= state.shown;
  writeHash();
}

// --- live enrollment layer: query the proxy for expanded cards ---
async function refreshLive(cards) {
  if (state.liveOk === false && Date.now() - state.liveFailAt < 5 * 60 * 1000) return;
  const nums = [...new Set(cards.flatMap(card =>
    [...card.querySelectorAll(".sec[data-cn]")].map(el => el.dataset.cn).filter(Boolean)))];
  for (let i = 0; i < nums.length; i += 60) {
    try {
      const r = await fetch(`${LIVE_API}/details?term=${state.term}&class_nums=${nums.slice(i, i + 60).join(",")}`,
        { signal: AbortSignal.timeout(20000) });
      if (!r.ok) throw new Error(r.status);
      const { results } = await r.json();
      state.liveOk = true;
      for (const [cn, d] of Object.entries(results)) {
        liveCache.set(cn, d);
        for (const el of document.querySelectorAll(`.sec[data-cn="${cn}"] .enr`))
          el.outerHTML = enrHtml({ ...d, _live: true });
      }
    } catch {
      state.liveOk = false; // proxy unreachable: stay on scraped data, retry in 5 min
      state.liveFailAt = Date.now();
      return;
    }
  }
}

document.addEventListener("toggle", e => {
  if (!e.target.matches?.("details.card")) return;
  writeHash();
  if (e.target.open) refreshLive([e.target]);
}, true);
// keep open cards fresh while the tab is visible
setInterval(() => {
  if (!document.hidden) refreshLive([...document.querySelectorAll("details.card[open]")]);
}, 60 * 1000);

let deb;
$("q").addEventListener("input", () => { clearTimeout(deb); deb = setTimeout(() => { state.shown = 40; render(); }, 120); });
for (const id of ["subject", "career", "openOnly", "hideNonsub"])
  $(id).addEventListener("change", () => { state.shown = 40; render(); });
$("more").addEventListener("click", () => { state.shown += 40; render(); });
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
});

loadIndex().catch(e => {
  $("results").innerHTML = `<div class="empty">Failed to load data (${esc(e.message)}). If this is a fresh deploy, the first data refresh may still be running.</div>`;
  $("updated").textContent = "";
});
</script>
</body>
</html>
